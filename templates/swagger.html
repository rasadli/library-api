<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Management API | Documentation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='swagger-ui/swagger-ui.css') }}">
  <style>body { margin: 0; background: #fafafa; }</style>
</head>
<body>
  <noscript>Enable JavaScript to use the interactive API documentation.</noscript>
  <div id="swagger-ui"></div>
  <script src="{{ url_for('static', filename='swagger-ui/swagger-ui-bundle.js') }}"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: {{ url_for('docs.openapi_spec') | tojson }},
      dom_id: "#swagger-ui",
      deepLinking: true,
      filter: true,
      docExpansion: "list",
      defaultModelsExpandDepth: 1,
      defaultModelExpandDepth: 2,
      displayRequestDuration: true,
      validatorUrl: null,
      supportedSubmitMethods: ["get", "post", "delete"],
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout"
    });
  </script>
</body>
</html>
